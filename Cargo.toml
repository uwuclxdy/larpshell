[package]
name = "larpshell"
version = "0.2.5"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Ctrl+C then Ctrl+V is simply too much work. Just let an LLM rule your terminal!!"
homepage = "https://github.com/uwuclxdy/larpshell"
repository = "https://github.com/uwuclxdy/larpshell"
readme = "README.md"
keywords = ["cli", "ai", "shell", "terminal", "larp"]
categories = ["command-line-utilities"]
# Trees the published tarball has no use for; media/ alone is 2.5M of demo assets.
# README image links are relative and crates.io resolves those against `repository`.
exclude = ["media/", "aur/", ".github/"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "sync", "io-util", "io-std"] }
tokio-util = "0.7.19"
# `charset` (default) only powers `text_with_charset`; provider bodies are UTF-8
# JSON, and `text()` has a non-charset path. `rustls` re-enables what `default-tls`
# would have given us anyway.
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
semver = "1.0.28"
toml = "1.1.4"
dirs = "6.0.0"
colored = "3.1.1"
thiserror = "2.0.19"
async-trait = "0.1.91"
inquire = "0.9.4"
# `with-dirs` only adds `~` expansion to `FilenameCompleter`, which this crate
# never constructs, and it drags in `home` (MSRV 1.88).
rustyline = { version = "18.0.1", default-features = false, features = ["custom-bindings", "with-file-history"] }
unicode-width = "0.2.2"
strip-ansi-escapes = "0.2.1"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.30"
terminal_size = "0.4.4"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["term"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
