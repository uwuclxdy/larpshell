[package]
name = "larpshell"
version = "0.2.5"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Ctrl+C then Ctrl+V is simply too much work. Just let an LLM rule your terminal!!"
homepage = "https://github.com/uwuclxdy/larpshell"
repository = "https://github.com/uwuclxdy/larpshell"
readme = "README.md"
keywords = ["cli", "ai", "shell", "terminal", "larp"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "signal", "sync", "io-util", "io-std"] }
tokio-util = "0.7.18"
reqwest = { version = "0.13.4", features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
semver = "1.0.28"
toml = "1.1.2"
dirs = "6.0.0"
colored = "3.1.1"
thiserror = "2.0.18"
async-trait = "0.1.89"
inquire = "0.9.4"
rustyline = "18.0.0"
unicode-width = "0.2.2"
strip-ansi-escapes = "0.2.1"
grep-regex = "0.1.14"
grep-searcher = "0.1.16"
ignore = "0.4.26"
terminal_size = "0.4.4"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["term"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
