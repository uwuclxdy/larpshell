[package]
name = "larpshell"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "Ctrl+C then Ctrl+V is simply too much work. Just let the LLMs rule your terminal directly!!"
homepage = "https://github.com/uwuclxdy/larpshell"
repository = "https://github.com/uwuclxdy/larpshell"
readme = "README.md"
keywords = ["cli", "ai", "shell", "terminal", "larp"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
tokio = { version = "1.51.0", features = ["rt-multi-thread", "macros", "signal", "sync"] }
tokio-util = "0.7.18"
reqwest = { version = "0.13.2", features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.2"
dirs = "6.0.0"
colored = "3.1.1"
thiserror = "2.0.18"
anyhow = "1.0.102"
async-trait = "0.1.89"
inquire = "0.9.4"
rustyline = "18.0.0"
log = "0.4.29"
unicode-width = "0.2.2"
strip-ansi-escapes = "0.2.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.2", features = ["term"] }
