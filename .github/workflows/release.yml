name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Third-party Actions are SHA-pinned: the aur-publish job holds AUR_SSH_PRIVATE_KEY, so a
# tag-only pin (@v6) would let a compromised upstream tag exfiltrate that secret. Bump the SHA
# and the trailing version comment together when updating.

jobs:
  # ── Job 1: resolve version, create the release page up front ─────────────
  # The page exists the moment the tag lands; notes are NOT auto-generated
  # (the release script writes them), the binary attaches when the build finishes.
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      - name: Resolve tag and version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
            if [[ -z "$TAG" ]]; then
              echo "::error::No v* tags found"
              exit 1
            fi
          fi
          VER="${TAG#v}"
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '${VER}' is not valid semver"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: false

  # ── Job 2: compile per-OS binaries natively, attach each to the release ───
  # larpshell is unix-only (real shell integration + platform code) — linux + macos
  # native runners, no windows row. The linux asset keeps the plain "larpshell"
  # filename so aur/larpshell/PKGBUILD's release-asset URL
  # (releases/download/v$pkgver/larpshell) keeps resolving; only the new macOS
  # asset gets an OS/arch suffix since nothing downloads it by a fixed name yet.
  build-and-release:
    name: Build ${{ matrix.asset_name }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: larpshell
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: larpshell-macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_DIR: target

      - name: Prepare asset
        run: cp "target/${{ matrix.target }}/release/larpshell" "${{ matrix.asset_name }}"

      - name: Upload release binary
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: ${{ matrix.asset_name }}
          fail_on_unmatched_files: true

      - name: Upload artifact for checksum job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  # ── Job 3: combined sha256sums.txt over every asset built above ───────────
  checksums:
    name: Checksums
    needs: [create-release, build-and-release]
    # Run even when one OS leg fails so the binaries that DID ship always have a
    # matching sums file covering exactly what was published.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate sha256sums.txt
        # Glob whatever was actually built so a partial release still produces a
        # sums file matching exactly what shipped.
        run: |
          cd artifacts
          sha256sum larpshell* > ../sha256sums.txt

      - name: Upload sha256sums.txt to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: sha256sums.txt

  # ── Job 4: update AUR packages ─────────────────────────────────────────────
  aur-publish:
    name: Publish to AUR
    needs: [create-release, build-and-release]
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    permissions:
      contents: write

    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm git openssh pacman-contrib

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: mommy
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup AUR SSH
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          AUR_KEY=/tmp/aur_ssh_key
          KNOWN_HOSTS=/tmp/aur_known_hosts
          # install -m 600 /dev/stdin writes at mode 600 atomically -- no mode-666 window like
          # `printf > file && chmod`. Strip stray CR so a CRLF-pasted secret still loads.
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY//$'\r'/}" | install -m 600 /dev/stdin "$AUR_KEY"
          ssh-keygen -y -f "$AUR_KEY" >/dev/null   # fail fast on a malformed key
          # Pinned AUR host keys -- no accept-new TOFU/MITM window. Fingerprints verified against
          # https://wiki.archlinux.org/title/AUR:
          #   ED25519 SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          #   RSA     SHA256:5s5cIyReIfNNVGRFdDbe3hdYiI5OelHGpw2rOUud3Q8
          cat > "$KNOWN_HOSTS" <<'PIN'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          aur.archlinux.org ssh-rsa 
          PIN
          chmod 600 "$KNOWN_HOSTS"
          echo "GIT_SSH_COMMAND=ssh -i ${AUR_KEY} -o UserKnownHostsFile=${KNOWN_HOSTS} -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

      - name: Setup non-root user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: Update larpshell PKGBUILD
        env:
          VER: ${{ needs.create-release.outputs.version }}
        run: |
          cd aur/larpshell
          sed -i "s/^pkgver=.*/pkgver=${VER}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          chown builder:builder PKGBUILD
          su builder -c "updpkgsums"
          su builder -c "makepkg --printsrcinfo > .SRCINFO"
          echo "=== Updated PKGBUILD ==="
          grep -E '^(pkgver|pkgrel|sha256sums)=' PKGBUILD

      - name: Update larpshell-git PKGBUILD and .SRCINFO
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          GITVER="r$(git rev-list --count HEAD).$(git rev-parse --short HEAD)"
          cd aur/larpshell-git
          sed -i "s/^pkgver=.*/pkgver=${GITVER}/" PKGBUILD
          chown builder:builder PKGBUILD
          su builder -c "makepkg --printsrcinfo > .SRCINFO"

      - name: Publish larpshell to AUR
        env:
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
          VER: ${{ needs.create-release.outputs.version }}
        run: |
          git clone --depth 1 ssh://aur@aur.archlinux.org/larpshell.git /tmp/aur-larpshell
          cp aur/larpshell/PKGBUILD /tmp/aur-larpshell/PKGBUILD
          cp aur/larpshell/.SRCINFO /tmp/aur-larpshell/.SRCINFO
          cd /tmp/aur-larpshell
          git config user.name "$AUR_USERNAME"
          git config user.email "$AUR_EMAIL"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet && echo "No changes to push" || {
            git commit -m "upgpkg: larpshell ${VER}"
            git push origin master
          }

      - name: Publish larpshell-git to AUR
        env:
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
        run: |
          git clone --depth 1 ssh://aur@aur.archlinux.org/larpshell-git.git /tmp/aur-larpshell-git
          cp aur/larpshell-git/PKGBUILD /tmp/aur-larpshell-git/PKGBUILD
          cp aur/larpshell-git/.SRCINFO /tmp/aur-larpshell-git/.SRCINFO
          cd /tmp/aur-larpshell-git
          git config user.name "$AUR_USERNAME"
          git config user.email "$AUR_EMAIL"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet && echo "No changes to push" || {
            git commit -m "update: larpshell-git PKGBUILD"
            git push origin master
          }

      - name: Commit updated AUR files to repo
        env:
          VER: ${{ needs.create-release.outputs.version }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aur/larpshell/PKGBUILD aur/larpshell/.SRCINFO aur/larpshell-git/PKGBUILD aur/larpshell-git/.SRCINFO
          git diff --cached --quiet && echo "No changes to commit" || {
            git commit -m "chore(aur): update packages for ${VER}"
            git push origin mommy
          }
