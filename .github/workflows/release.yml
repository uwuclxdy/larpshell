name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# aur-publish holds AUR_SSH_PRIVATE_KEY, so its third-party Actions are SHA-pinned: a tag-only
# pin (@v6) would let a compromised upstream tag exfiltrate that secret. Bump the SHA and the
# trailing version comment together when updating it. The other jobs (create-release, build,
# checksums) don't touch that secret, so they use @v tags to match the fleet.

jobs:
  # ── Job 1: resolve version, create the release page up front ─────────────
  # The page exists the moment the tag lands; notes are NOT auto-generated
  # (the release script writes them), the binary attaches when the build finishes.
  # workflow_dispatch (no tag ref) resolves the latest v* tag so the whole pipeline
  # — including aur-publish — can be re-run manually to re-publish AUR without
  # cutting a new tag.
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tag and version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
            if [[ -z "$TAG" ]]; then
              echo "::error::No v* tags found"
              exit 1
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Validate tag is semver
        # Tightens the `v*` trigger to strict vX.Y.Z — a malformed tag otherwise
        # mints a broken Release page. Pre-release suffixes (`v1.2.3-rc1`) need
        # the regex relaxed. Tag/version come in via env (not `${{ }}` inline) so
        # a crafted tag name can't inject into this shell.
        env:
          VER: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '${TAG}' is not vX.Y.Z"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: false

  # ── Job 2: compile per-OS binaries natively, attach each to the release ───
  # larpshell is unix-only (real shell integration + platform code) — linux + macos
  # native runners, no windows row. Each row ships a bare per-OS binary named
  # larpshell-<os>-<arch>; aur/larpshell/PKGBUILD sources the linux asset by that name.
  build:
    name: Build ${{ matrix.asset_name }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write        # softprops/action-gh-release
      id-token: write        # OIDC — keyless build-provenance attestation
      attestations: write    # actions/attest-build-provenance
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: larpshell-linux-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: larpshell-macos-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare asset
        run: cp "target/${{ matrix.target }}/release/larpshell" "${{ matrix.asset_name }}"

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: ${{ matrix.asset_name }}
          fail_on_unmatched_files: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ matrix.asset_name }}

      - name: Upload artifact for checksum job
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  # ── Job 3: combined sha256sums.txt over every asset built above ───────────
  checksums:
    name: Checksums
    # create-release stays in needs (not just build): workflow_dispatch has no tag
    # ref, so the upload reads the tag from create-release's output — and transitive
    # needs don't expose outputs.
    needs: [create-release, build]
    # Run even when one OS leg fails so the binaries that DID ship always have a
    # matching sums file covering exactly what was published.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate sha256sums.txt
        # Glob whatever was actually built so a partial release still produces a
        # sums file matching exactly what shipped.
        run: |
          cd artifacts
          sha256sum larpshell-* > ../sha256sums.txt

      - name: Upload sha256sums.txt to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          files: sha256sums.txt

  # ── Job 4: update AUR packages ─────────────────────────────────────────────
  aur-publish:
    name: Publish to AUR
    needs: [create-release, build]
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    permissions:
      contents: write

    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm git openssh pacman-contrib

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: mommy
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup AUR SSH
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          AUR_KEY=/tmp/aur_ssh_key
          KNOWN_HOSTS=/tmp/aur_known_hosts
          # install -m 600 /dev/stdin writes at mode 600 atomically -- no mode-666 window like
          # `printf > file && chmod`. Strip stray CR so a CRLF-pasted secret still loads.
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY//$'\r'/}" | install -m 600 /dev/stdin "$AUR_KEY"
          ssh-keygen -y -f "$AUR_KEY" >/dev/null   # fail fast on a malformed key
          # Pinned AUR host keys -- no accept-new TOFU/MITM window. Fingerprints verified against
          # https://wiki.archlinux.org/title/AUR:
          #   ED25519 SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4
          #   RSA     SHA256:5s5cIyReIfNNVGRFdDbe3hdYiI5OelHGpw2rOUud3Q8
          cat > "$KNOWN_HOSTS" <<'PIN'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          aur.archlinux.org ssh-rsa 
          PIN
          chmod 600 "$KNOWN_HOSTS"
          echo "GIT_SSH_COMMAND=ssh -i ${AUR_KEY} -o UserKnownHostsFile=${KNOWN_HOSTS} -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

      - name: Setup non-root user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: Update larpshell PKGBUILD
        env:
          VER: ${{ needs.create-release.outputs.version }}
        run: |
          cd aur/larpshell
          sed -i "s/^pkgver=.*/pkgver=${VER}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          chown builder:builder PKGBUILD
          su builder -c "updpkgsums"
          su builder -c "makepkg --printsrcinfo > .SRCINFO"
          echo "=== Updated PKGBUILD ==="
          grep -E '^(pkgver|pkgrel|sha256sums)=' PKGBUILD

      - name: Update larpshell-git PKGBUILD and .SRCINFO
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          GITVER="r$(git rev-list --count HEAD).$(git rev-parse --short HEAD)"
          cd aur/larpshell-git
          sed -i "s/^pkgver=.*/pkgver=${GITVER}/" PKGBUILD
          chown builder:builder PKGBUILD
          su builder -c "makepkg --printsrcinfo > .SRCINFO"

      - name: Publish larpshell to AUR
        env:
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
          VER: ${{ needs.create-release.outputs.version }}
        run: |
          git clone --depth 1 ssh://aur@aur.archlinux.org/larpshell.git /tmp/aur-larpshell
          cp aur/larpshell/PKGBUILD /tmp/aur-larpshell/PKGBUILD
          cp aur/larpshell/.SRCINFO /tmp/aur-larpshell/.SRCINFO
          cd /tmp/aur-larpshell
          git config user.name "$AUR_USERNAME"
          git config user.email "$AUR_EMAIL"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet && echo "No changes to push" || {
            git commit -m "upgpkg: larpshell ${VER}"
            git push origin master
          }

      - name: Publish larpshell-git to AUR
        env:
          AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
          AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
        run: |
          git clone --depth 1 ssh://aur@aur.archlinux.org/larpshell-git.git /tmp/aur-larpshell-git
          cp aur/larpshell-git/PKGBUILD /tmp/aur-larpshell-git/PKGBUILD
          cp aur/larpshell-git/.SRCINFO /tmp/aur-larpshell-git/.SRCINFO
          cd /tmp/aur-larpshell-git
          git config user.name "$AUR_USERNAME"
          git config user.email "$AUR_EMAIL"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet && echo "No changes to push" || {
            git commit -m "update: larpshell-git PKGBUILD"
            git push origin master
          }

      - name: Commit updated AUR files to repo
        env:
          VER: ${{ needs.create-release.outputs.version }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aur/larpshell/PKGBUILD aur/larpshell/.SRCINFO aur/larpshell-git/PKGBUILD aur/larpshell-git/.SRCINFO
          git diff --cached --quiet && echo "No changes to commit" || {
            git commit -m "chore(aur): update packages for ${VER}"
            git push origin mommy
          }
