name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ── Job 1: compile binary, create GitHub release ─────────────────────────
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve tag and version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
            if [[ -z "$TAG" ]]; then
              echo "::error::No v* tags found"
              exit 1
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release --locked
        env:
          CARGO_TARGET_DIR: target

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: target/release/larpshell
          generate_release_notes: true
          fail_on_unmatched_files: true

  # ── Job 2: update AUR release package ────────────────────────────────────
  aur-release:
    name: Publish to AUR
    needs: build-and-release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: mommy
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Checksums
        id: checksum
        run: |
          VER="${{ needs.build-and-release.outputs.version }}"
          BIN_URL="https://github.com/uwuclxdy/larpshell/releases/download/v${VER}/larpshell"
          LIC_URL="https://raw.githubusercontent.com/uwuclxdy/larpshell/v${VER}/LICENSE"
          BIN_SHA=$(curl -fsSL "$BIN_URL" | sha256sum | awk '{print $1}')
          LIC_SHA=$(curl -fsSL "$LIC_URL" | sha256sum | awk '{print $1}')
          echo "bin_sha256=${BIN_SHA}" >> "$GITHUB_OUTPUT"
          echo "lic_sha256=${LIC_SHA}" >> "$GITHUB_OUTPUT"

      - name: Update PKGBUILD with new version and checksums
        run: |
          VER="${{ needs.build-and-release.outputs.version }}"
          BIN_SHA="${{ steps.checksum.outputs.bin_sha256 }}"
          LIC_SHA="${{ steps.checksum.outputs.lic_sha256 }}"
          PKGBUILD="aur/larpshell/PKGBUILD"

          sed -i "s/^pkgver=.*/pkgver=${VER}/" "$PKGBUILD"
          sed -i "s/^pkgrel=.*/pkgrel=1/"      "$PKGBUILD"
          sed -i "s/^sha256sums=.*/sha256sums=('${BIN_SHA}' '${LIC_SHA}')/" "$PKGBUILD"

          echo "Updated PKGBUILD:"
          grep -E '^(pkgver|pkgrel|sha256sums)=' "$PKGBUILD"

      - name: Generate .SRCINFO
        run: |
          VER="${{ needs.build-and-release.outputs.version }}"
          BIN_SHA="${{ steps.checksum.outputs.bin_sha256 }}"
          LIC_SHA="${{ steps.checksum.outputs.lic_sha256 }}"
          T=$(printf '\t')
          {
            echo "pkgbase = larpshell"
            echo "${T}pkgdesc = Convert natural language to shell commands using an LLM"
            echo "${T}pkgver = ${VER}"
            echo "${T}pkgrel = 1"
            echo "${T}url = https://github.com/uwuclxdy/larpshell"
            echo "${T}arch = x86_64"
            echo "${T}license = MIT"
            echo "${T}depends = gcc-libs"
            echo "${T}depends = glibc"
            echo "${T}source = larpshell-${VER}::https://github.com/uwuclxdy/larpshell/releases/download/v${VER}/larpshell"
            echo "${T}source = LICENSE-${VER}::https://raw.githubusercontent.com/uwuclxdy/larpshell/v${VER}/LICENSE"
            echo "${T}sha256sums = ${BIN_SHA}"
            echo "${T}sha256sums = ${LIC_SHA}"
            echo ""
            echo "pkgname = larpshell"
          } > aur/larpshell/.SRCINFO

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.1
        with:
          pkgname: larpshell
          pkgbuild: aur/larpshell/PKGBUILD
          assets: aur/larpshell/.SRCINFO
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "upgpkg: larpshell ${{ needs.build-and-release.outputs.version }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Commit updated PKGBUILD and .SRCINFO
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aur/larpshell/PKGBUILD aur/larpshell/.SRCINFO
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "chore(aur): update larpshell to ${{ needs.build-and-release.outputs.version }}"
          git push origin mommy
